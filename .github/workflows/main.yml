
name: ARTFLOW - Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artflow-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy ARTFLOW
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Vercel credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::Missing VERCEL_TOKEN secret"
            exit 1
          }
          test -n "$VERCEL_ORG_ID" || {
            echo "::error::Missing VERCEL_ORG_ID secret"
            exit 1
          }
          test -n "$VERCEL_PROJECT_ID" || {
            echo "::error::Missing VERCEL_PROJECT_ID secret"
            exit 1
          }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build ARTFLOW
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy ARTFLOW to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
